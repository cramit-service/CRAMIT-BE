# 테스트 전용 프로필: 로컬/외부 DB 없이 H2 인메모리 DB로 컨텍스트 로드만 검증
spring:
  datasource:
    url: jdbc:h2:mem:cramit;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false

spring:
  application:
    name: cramit
  profiles:
    active: local
  jpa:
    open-in-view: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,circuitbreakers,circuitbreakerevents
  endpoint:
    health:
      show-details: when-authorized
  health:
    circuitbreakers:
      enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{traceId}] %-5level %logger{36} - %msg%n"

# 기본 aspect 순서는 @Retry가 @CircuitBreaker를 감싸는 구조라, CircuitBreaker의
# sliding window(minimum-number-of-calls 등)는 "외부 API 호출 시도 1회당 1건"으로 집계된다.
# (재시도로 인한 재호출도 각각 별도 시도로 집계됨, 논리적인 call() 요청 1건 기준이 아님)
# 이 기준을 "call() 요청 수"로 바꾸려면 circuitBreakerAspectOrder를 retryAspectOrder보다
# 낮게 설정해서 CircuitBreaker가 재시도 전체를 감싸도록 순서를 바꿔야 한다.
resilience4j:
  timelimiter:
    instances:
      oauth:
        timeout-duration: 5s
      stt:
        timeout-duration: 30s
      gemini:
        timeout-duration: 20s
  retry:
    instances:
      oauth:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
      stt:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
      # 전사 한 번이 수 분 걸려서 타임아웃은 다시 보내지 않는다. 429는 분당 한도라 간격을 넉넉히 둔다.
      azure-stt:
        max-attempts: 3
        wait-duration: 5s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.web.client.HttpClientErrorException$TooManyRequests
          - org.springframework.web.client.HttpServerErrorException
      gemini:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        retry-exceptions:
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException
  circuitbreaker:
    instances:
      oauth:
        sliding-window-size: 5
        minimum-number-of-calls: 5
        failure-rate-threshold: 100
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 1
      stt:
        sliding-window-size: 5
        minimum-number-of-calls: 5
        failure-rate-threshold: 100
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 1
      # 여러 강의의 교정·매핑이 동시에 돌면 Gemini가 잠깐 503만 내도 5번은 금방 채워져, 서버 전체 Gemini 호출이
      # 1분간 막혔다. 재시도도 한 번씩 세므로 창을 20번으로 늘리고, 열려 있는 시간은 30초로 줄인다.
      gemini:
        sliding-window-size: 20
        minimum-number-of-calls: 20
        failure-rate-threshold: 100
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        # 응답 형식 오류(BusinessException)는 Gemini 장애가 아니므로 집계하지 않는다. 5xx·타임아웃은 계속 집계한다.
        ignore-exceptions:
            - org.springframework.web.client.HttpClientErrorException
            - com.cramit.global.exception.BusinessException

name: cramit

services:
  postgres:
    image: postgres:16
    container_name: cramit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cramit
      POSTGRES_USER: cramit
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cramit}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - cramit-postgres-data:/var/lib/postgresql/data

volumes:
  cramit-postgres-data:

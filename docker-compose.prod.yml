# 운영 서버 배포용. `.env`를 채운 뒤 `docker compose -f docker-compose.prod.yml up -d --build`.
# DB(RDS)는 이미 외부에 떠 있다고 보고 app 컨테이너만 그 주소로 접속한다. Redis는 이 compose 안에서
# 컨테이너로 띄우고(내부 네트워크 전용, 외부 포트 없음) app이 REDIS_HOST=redis로 접속한다.
# 여는 포트는 nginx 80(HTTPS로 리다이렉트)·443뿐이다. app은 밖에 포트를 열지 않는다.
# 인증서: 처음 뜰 때 tls-init이 연습용(자체 서명)을 만들고, 서버에서는 docker/certbot/issue.sh로 Let's Encrypt로 바꾼다.

name: cramit-prod

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # refresh token만 저장하는 캐시라 유실돼도 재로그인이면 끝이지만, 재시작마다 전원 재로그인을
    # 겪지 않도록 AOF를 켠다.
    command: redis-server --appendonly yes --appendfsync always
    volumes:
      - redis-data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      REDIS_HOST: redis
      # .env에 예전 외부 Redis용 REDIS_PORT가 남아있어도 이 compose의 redis(6379)로 고정해서 쓴다
      REDIS_PORT: "6379"
      # GOOGLE_STT_CREDENTIALS_PATH는 .env에서 /app/secrets/gcp-stt.json로 지정한다 (아래 volumes와 맞춰야 함)
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      # 서버의 실제 GCP STT 서비스 계정 키 파일을 읽기 전용으로 마운트한다. 이 파일은 저장소에 올리지 않는다.
      - ./secrets/gcp-stt.json:/app/secrets/gcp-stt.json:ro
    networks:
      - internal
    healthcheck:
      # Spring Boot가 8080을 실제로 열 때까지는 TCP 연결 자체가 실패한다 (actuator 없이도 기동 완료 시점을 알 수 있음).
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # 인증서가 없을 때만 연습용(자체 서명) 인증서를 만드는 일회성 컨테이너. 이미 있으면 아무것도 하지 않는다.
  tls-init:
    image: certbot/certbot:v5.8.0
    entrypoint: ["sh", "/scripts/self-signed.sh"]
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?접속 도메인을 .env에 넣어 주세요}
    volumes:
      - tls:/tls
      - ./docker/certbot/self-signed.sh:/scripts/self-signed.sh:ro
      - ./docker/certbot/publish-cert.sh:/scripts/publish-cert.sh:ro
    network_mode: none

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
      tls-init:
        condition: service_completed_successfully
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?접속 도메인을 .env에 넣어 주세요}
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    volumes:
      - ./docker/nginx/templates:/etc/nginx/templates:ro
      - tls:/etc/nginx/certs:ro
      - acme-webroot:/var/www/certbot:ro
    networks:
      internal:
        # application-prod.yml의 server.tomcat.remoteip.internal-proxies(APP_NGINX_INTERNAL_IP)와 같은 주소여야 한다.
        # RDS·Redis·VPC 대역과 겹치면 app이 외부 대신 이 네트워크로 라우팅하므로, 겹칠 경우 .env의
        # APP_COMPOSE_SUBNET·APP_NGINX_INTERNAL_IP를 겹치지 않는 값으로 바꾼다.
        ipv4_address: ${APP_NGINX_INTERNAL_IP:-172.28.0.10}

  # Let's Encrypt 발급·갱신 전용 (docker/certbot/issue.sh·renew.sh가 실행). 평소 up에는 뜨지 않는다.
  certbot:
    image: certbot/certbot:v5.8.0
    profiles: ["certbot"]
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?접속 도메인을 .env에 넣어 주세요}
      APP_CERT_EMAIL: ${APP_CERT_EMAIL:?.env에 APP_CERT_EMAIL이 필요합니다}
    volumes:
      - letsencrypt:/etc/letsencrypt
      - acme-webroot:/var/www/certbot
      - tls:/tls
      - ./docker/certbot/check-tls.sh:/scripts/check-tls.sh:ro
      - ./docker/certbot/publish-cert.sh:/scripts/publish-cert.sh:ro

networks:
  internal:
    ipam:
      config:
        # RDS·Redis가 이 대역에 있으면 app이 외부 대신 이 네트워크로 보내 접속이 끊긴다.
        # 겹칠 경우 .env에 APP_COMPOSE_SUBNET을 겹치지 않는 값으로 지정한다.
        - subnet: ${APP_COMPOSE_SUBNET:-172.28.0.0/24}

volumes:
  tls:
  letsencrypt:
  acme-webroot:
  redis-data:

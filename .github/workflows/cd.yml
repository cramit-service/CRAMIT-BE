name: CD

# develop에 대한 CI(테스트)가 성공적으로 끝난 뒤에만 배포한다 - 테스트가 깨진 커밋이
# 그대로 운영 서버에 올라가는 것을 막기 위해 push 트리거 대신 workflow_run을 쓴다.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# 수동 배포(workflow_dispatch)와 자동 배포가 겹치면 같은 서버 디렉터리를 동시에 건드려 꼬일 수 있어서,
# 동시에 하나만 돌고 나머지는 끝날 때까지 대기열에서 기다리게 한다.
concurrency:
  group: cd-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: AWS 자격 증명 설정 (OIDC, 장기 액세스 키 없이 역할만 임시로 빌림)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: 이 러너의 공인 IP를 보안그룹에 임시 허용
        # GitHub 호스팅 러너는 매 실행마다 IP가 바뀌어서, 평소엔 관리자 IP만 허용된 22번 포트를
        # 이번 배포에 한해서만 열어준다. 배포 성공/실패와 무관하게 마지막 스텝에서 반드시 제거한다.
        id: allow-ip
        run: |
          set -euo pipefail
          RUNNER_IP="$(curl -sf https://checkip.amazonaws.com)"
          echo "runner_ip=${RUNNER_IP}" >> "$GITHUB_OUTPUT"
          aws ec2 authorize-security-group-ingress \
            --group-id "${{ secrets.EC2_SECURITY_GROUP_ID }}" \
            --protocol tcp --port 22 --cidr "${RUNNER_IP}/32"

      - name: SSH 키 준비
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: 운영 서버에서 CI 통과한 커밋으로 재배포
        # workflow_run으로 자동 실행될 때는 CI가 성공한 그 커밋(head_sha)에 고정해서 배포한다 -
        # 이 사이 develop에 새 커밋이 더 쌓여도 아직 검증 안 된 커밋이 끼어들지 않는다.
        # 수동 실행(workflow_dispatch)은 그런 기준 커밋이 없으니 origin/develop 최신 상태로 배포한다.
        env:
          DEPLOY_REF: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'origin/develop' }}
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" '
            set -e
            cd /home/ubuntu/CRAMIT-BE
            git fetch origin
            git reset --hard '"${DEPLOY_REF}"'
            docker compose -f docker-compose.prod.yml build app
            docker compose -f docker-compose.prod.yml up -d app
            docker compose -f docker-compose.prod.yml exec -T nginx nginx -s reload
          '

      - name: 배포 후 헬스체크
        # 실제로 기동에 ~30초 걸리는 걸 확인했어서, 고정 대기 대신 최대 2분(10회 x 12초)까지 재시도한다.
        # curl 자체에도 타임아웃을 줘서, 요청이 멈춰버리는 경우에도 전체 재시도 시간이 실제로 지켜지게 한다.
        run: |
          set -uo pipefail
          for i in $(seq 1 10); do
            sleep 12
            if curl -sf --connect-timeout 5 --max-time 10 "https://${{ secrets.APP_HEALTH_HOST }}/actuator/health"; then
              echo "헬스체크 성공"
              exit 0
            fi
            echo "헬스체크 재시도 ($i/10)"
          done
          echo "헬스체크 실패: 서버가 제시간 안에 올라오지 않음"
          exit 1

      - name: SSH 키 정리
        if: always()
        run: rm -f ~/.ssh/deploy_key

      - name: 러너 IP를 보안그룹에서 제거
        if: always() && steps.allow-ip.outputs.runner_ip != ''
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id "${{ secrets.EC2_SECURITY_GROUP_ID }}" \
            --protocol tcp --port 22 --cidr "${{ steps.allow-ip.outputs.runner_ip }}/32"

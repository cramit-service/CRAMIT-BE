name: CD

# develop에 대한 CI(테스트)가 성공적으로 끝난 뒤에만 배포한다 - 테스트가 깨진 커밋이
# 그대로 운영 서버에 올라가는 것을 막기 위해 push 트리거 대신 workflow_run을 쓴다.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: SSH 키 준비
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: 운영 서버에서 최신 develop으로 재배포
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" '
            set -e
            cd /home/ubuntu/CRAMIT-BE
            git fetch origin
            git reset --hard origin/develop
            docker compose -f docker-compose.prod.yml build app
            docker compose -f docker-compose.prod.yml up -d app
          '

      - name: 배포 후 헬스체크
        run: |
          set -euo pipefail
          sleep 25
          curl -sf "https://${{ secrets.APP_HEALTH_HOST }}/actuator/health"

      - name: SSH 키 정리
        if: always()
        run: rm -f ~/.ssh/deploy_key
